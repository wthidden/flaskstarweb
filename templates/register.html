<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
    <nav>
        <a href="{{ url_for('login') }}">Already have an account? Login</a>
        <!-- Link to a potential homepage -->
    </nav>
    <hr>
    <h2>Register New User</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class=flashes>
        {% for category, message in messages %}
          <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('register') }}">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <div>
            <label for="character_type">Choose your Character Type:</label>
            <select id="character_type" name="character_type" required>
                {% for char_type in character_types %}
                <option value="{{ char_type }}">{{ char_type }}</option>
                {% else %}
                <!-- Fallback if character_types is not passed or empty, though backend validation exists -->
                <option value="Empire Builder">Empire Builder</option>
                <option value="Merchant">Merchant</option>
                <option value="Pirate">Pirate</option>
                <option value="Artifact Collector">Artifact Collector</option>
                <option value="Berserker">Berserker</option>
                <option value="Apostle">Apostle</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <button type="submit">Register</button>
        </div>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
</body>
</html>
